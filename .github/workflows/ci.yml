name: Build and test

on:
  push:
    branches: [main, "feature/**", "fix/**", "other-features"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    name: Backend Maven verify
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: medicontinuum
          POSTGRES_USER: medicontinuum
          POSTGRES_PASSWORD: medicontinuum_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U medicontinuum -d medicontinuum"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: Verify backend
        env:
          DB_URL: jdbc:postgresql://localhost:5432/medicontinuum
          DB_USERNAME: medicontinuum
          DB_PASSWORD: medicontinuum_ci
          DDL_AUTO: update
          JWT_SECRET: "CI-only-secret-not-for-production-0123456789abcdef"
          CORS_ALLOWED_ORIGINS: http://localhost:5173
          NOTIFICATION_EMAIL_ENABLED: "false"
          GOOGLE_OAUTH2_ENABLED: "false"
        run: ./mvnw -B verify

  frontend:
    name: Frontend build (${{ matrix.app }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app:
          - medicontinuum-web
          - medicontinuum-organization
    defaults:
      run:
        working-directory: frontend/${{ matrix.app }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/${{ matrix.app }}/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build Vite application
        run: npm run build
