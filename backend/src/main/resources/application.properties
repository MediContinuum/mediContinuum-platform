# Application
spring.application.name=backend
server.port=${SERVER_PORT:8080}

# PostgreSQL - credentials must be provided through environment variables.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/medicontinuum}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# Non-destructive local schema update. Production uses reviewed schema migrations.
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=${APP_TIME_ZONE:Asia/Kolkata}

# Authentication
app.security.jwt-secret=${JWT_SECRET:}
app.security.jwt-expiration-minutes=${JWT_EXPIRATION_MINUTES:30}
app.security.refresh-expiration-days=${JWT_REFRESH_EXPIRATION_DAYS:30}

# Frontend CORS origins - comma-separated.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Application time zone
app.time-zone=${APP_TIME_ZONE:Asia/Kolkata}
spring.jackson.time-zone=${APP_TIME_ZONE:Asia/Kolkata}

# Optional email delivery. In-app notifications work while this is disabled.
notification.email.enabled=${NOTIFICATION_EMAIL_ENABLED:false}
notification.email.from=${MAIL_FROM:}
notification.email.delivery-delay-ms=${NOTIFICATION_EMAIL_DELIVERY_DELAY_MS:30000}
notification.email.max-attempts=${NOTIFICATION_EMAIL_MAX_ATTEMPTS:5}
notification.email.batch-size=${NOTIFICATION_EMAIL_BATCH_SIZE:50}
notification.email.processing-timeout-minutes=${NOTIFICATION_EMAIL_PROCESSING_TIMEOUT_MINUTES:15}

# SMTP (credentials supplied at runtime)
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Medication adherence
adherence.missed-grace-hours=${ADHERENCE_MISSED_GRACE_HOURS:2}
adherence.missed-check-delay-ms=${ADHERENCE_MISSED_CHECK_DELAY_MS:60000}

# Inventory
inventory.expiry-warning-days=${INVENTORY_EXPIRY_WARNING_DAYS:30}
inventory.expiry-warning-cron=${INVENTORY_EXPIRY_WARNING_CRON:0 0 9 * * *}
inventory.expiry-check-delay-ms=${INVENTORY_EXPIRY_CHECK_DELAY_MS:3600000}
