# Application
spring.application.name=backend

# PostgreSQL Database Configuration
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/medicontinuum}
spring.datasource.username=${DB_USERNAME:ayushkumar}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate / JPA
# Local-development setting. Use controlled migrations in production.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Server
server.port=8080

# Email notification switch
notification.email.enabled=${NOTIFICATION_EMAIL_ENABLED:false}
notification.email.from=${MAIL_FROM:${MAIL_USERNAME:}}

# SMTP configuration
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Notification / scheduler configuration
adherence.missed-grace-hours=${ADHERENCE_MISSED_GRACE_HOURS:2}
adherence.missed-check-delay-ms=${ADHERENCE_MISSED_CHECK_DELAY_MS:60000}
inventory.expiry-warning-days=${INVENTORY_EXPIRY_WARNING_DAYS:30}
inventory.expiry-warning-cron=${INVENTORY_EXPIRY_WARNING_CRON:0 0 9 * * *}
inventory.expiry-check-delay-ms=${INVENTORY_EXPIRY_CHECK_DELAY_MS:3600000}
app.time-zone=${APP_TIME_ZONE:Asia/Kolkata}
notification.email.delivery-delay-ms=${NOTIFICATION_EMAIL_DELIVERY_DELAY_MS:30000}
notification.email.max-attempts=${NOTIFICATION_EMAIL_MAX_ATTEMPTS:5}
