# Application
spring.application.name=backend
server.port=${SERVER_PORT:8080}

# PostgreSQL - credentials must be provided through environment variables.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/medicontinuum}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# Non-destructive local schema update. Production uses reviewed schema migrations.
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=${APP_TIME_ZONE:Asia/Kolkata}

# Authentication
app.security.jwt-secret=${JWT_SECRET:}
app.security.jwt-expiration-minutes=${JWT_EXPIRATION_MINUTES:30}
app.security.refresh-expiration-days=${JWT_REFRESH_EXPIRATION_DAYS:30}

# Gemini API credentials are server-side only; never place GEMINI_API_KEY in frontend variables.
app.ai.gemini.api-key=${GEMINI_API_KEY:}
app.ai.gemini.model=${GEMINI_MODEL:gemini-3.8-flash}

# Frontend CORS origins - comma-separated.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Application time zone
app.time-zone=${APP_TIME_ZONE:Asia/Kolkata}
spring.jackson.time-zone=${APP_TIME_ZONE:Asia/Kolkata}

# Optional email delivery. In-app notifications work while this is disabled.
notification.email.enabled=${NOTIFICATION_EMAIL_ENABLED:false}
notification.email.from=${MAIL_FROM:}
notification.email.delivery-delay-ms=${NOTIFICATION_EMAIL_DELIVERY_DELAY_MS:30000}
notification.email.max-attempts=${NOTIFICATION_EMAIL_MAX_ATTEMPTS:5}
notification.email.batch-size=${NOTIFICATION_EMAIL_BATCH_SIZE:50}
notification.email.processing-timeout-minutes=${NOTIFICATION_EMAIL_PROCESSING_TIMEOUT_MINUTES:15}

# SMTP (credentials supplied at runtime)
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Medication adherence
adherence.missed-grace-hours=${ADHERENCE_MISSED_GRACE_HOURS:2}
adherence.missed-check-delay-ms=${ADHERENCE_MISSED_CHECK_DELAY_MS:60000}

# Inventory
inventory.expiry-warning-days=${INVENTORY_EXPIRY_WARNING_DAYS:30}
inventory.expiry-warning-cron=${INVENTORY_EXPIRY_WARNING_CRON:0 0 9 * * *}
inventory.expiry-check-delay-ms=${INVENTORY_EXPIRY_CHECK_DELAY_MS:3600000}

# Optional Google OpenID Connect login. Spring registration details are supplied through env variables.
app.security.oauth2.google.enabled=${GOOGLE_OAUTH2_ENABLED:false}

# Per-instance API rate limiting and request-shape protection.
app.security.rate-limit.enabled=${API_RATE_LIMIT_ENABLED:true}
app.security.rate-limit.burst=${API_RATE_LIMIT_BURST:60}
app.security.rate-limit.refill-per-second=${API_RATE_LIMIT_REFILL_PER_SECOND:1}
app.security.rate-limit.ai-demo-burst=${API_RATE_LIMIT_AI_DEMO_BURST:8}
app.security.rate-limit.ai-demo-refill-per-second=${API_RATE_LIMIT_AI_DEMO_REFILL_PER_SECOND:0.1}
app.security.rate-limit.max-tracked-clients=${API_RATE_LIMIT_MAX_TRACKED_CLIENTS:50000}
app.security.rate-limit.idle-minutes=${API_RATE_LIMIT_IDLE_MINUTES:10}
app.security.request-guard.max-body-bytes=${API_MAX_REQUEST_BODY_BYTES:1048576}
app.security.request-guard.max-query-length=${API_MAX_QUERY_LENGTH:4096}

# Actuator monitoring: health public, all other endpoints restricted to PLATFORM_ADMIN.
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.prometheus.metrics.export.enabled=true

# Correlation IDs are added by RequestTelemetryFilter.
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [requestId:%X{requestId:-}] %logger{36} - %msg%n

# OAuth2 browser authorization state cookie. Set SESSION_COOKIE_SECURE=true behind HTTPS.
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}

# Request header and form-post limits at the embedded container boundary.
server.max-http-request-header-size=16KB
server.tomcat.max-http-form-post-size=1MB
server.tomcat.max-swallow-size=1MB
